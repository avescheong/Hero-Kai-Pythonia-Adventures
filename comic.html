<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hero Kai · Pythonia Webtoon Comic — The Eleven Spells of Kindness</title>
  <meta name="description" content="Read Kai's Pythonia Adventure (Vol. 1 & Vol. 2 Manga v5.3 · 20 Episodes) in seamless vertical Webtoon format, bilingual EN & 繁體中文, with live interactive Python Spell Portals." />

  <!-- Modular Standalone Stylesheets (Story_Website Pythonia Theme) -->
  <link rel="stylesheet" href="css/01-comic-tokens.css" />
  <link rel="stylesheet" href="css/02-comic-chrome.css" />
  <link rel="stylesheet" href="css/03-comic-hub.css" />
  <link rel="stylesheet" href="css/04-comic-reader.css" />
  <link rel="stylesheet" href="css/05-comic-modules.css" />
  <link rel="stylesheet" href="css/06-comic-responsive.css" />
  <link rel="stylesheet" href="css/07-comic-hyperframe.css" />
</head>
<body class="view-hub" data-reader-theme="forest" data-hyperframe="living">
  <!-- Living Multi-Plane Biome Hyperframe (Comic Page Only) -->
  <div id="comic-hyperframe" class="comic-hyperframe" aria-hidden="true">
    <div class="hf-backdrop">
      <img class="hf-backdrop__img is-active" id="hf-bg-a" src="assets/hero-whispering-forest.webp" alt="" decoding="async" />
      <img class="hf-backdrop__img" id="hf-bg-b" src="assets/citadel-sanctuary.webp" alt="" decoding="async" />
    </div>
    <div class="hf-aura" id="hf-aura"></div>
    <div class="hf-scrim"></div>
    <canvas class="hf-particles" id="hf-particles"></canvas>
    <div class="hf-arch-layer" id="hf-arch-layer">
      <img class="hf-arch hf-arch--left" src="assets/plane3-arch.png" alt="" decoding="async" />
      <img class="hf-arch hf-arch--right" src="assets/plane3-arch.png" alt="" decoding="async" />
    </div>
    <div class="hf-bezel-lines"></div>
  </div>
  <div class="comic-progress-bar" id="comic-progress-bar" aria-hidden="true"></div>
  <div class="sc-grain" aria-hidden="true"></div>
  <!-- Same soothing background music as the main storybook site -->
  <audio id="kc-bgm-audio" src="assets/audio/peaceful.mp3" loop preload="auto"></audio>

  <!-- Fixed Top-Left Brand Seal -->
  <a class="kc-seal" id="kc-seal-home" href="#hub" aria-label="Return to Webtoon Series Hub">
    <span class="kc-seal__stamp" aria-hidden="true">11</span>
    <span class="kc-seal__meta">
      <span class="kc-seal__title" data-i18n="sealTitle">Hero Kai Webtoon</span>
      <span class="kc-seal__sub" data-i18n="sealSub">Vol. 1 &amp; 2 · 20 Episodes</span>
    </span>
  </a>

  <!-- Fixed Top-Right Control Bar -->
  <div class="kc-topbar-right">
    <div class="kc-controls-row">
      <a class="kc-hub-pill" id="kc-parent-site-link" href="./index.html" data-i18n="backToSite">🏰 Pythonia Site</a>
      <div class="kc-lang-switch" role="group" aria-label="Language selection">
        <button class="kc-lang-btn" type="button" data-lang-btn="en" aria-pressed="false">EN</button>
        <button class="kc-lang-btn" type="button" data-lang-btn="zh-Hant" aria-pressed="false">繁體中文</button>
        <button class="kc-lang-btn" type="button" data-lang-btn="dual" aria-pressed="true">雙語</button>
      </div>
      <button class="kc-ctrl-btn" type="button" id="kc-sound-btn" data-active="true" aria-pressed="true">
        <span aria-hidden="true">♪</span>
        <span data-i18n="soundOn">Music: ON</span>
      </button>
      <button class="kc-ctrl-btn" type="button" id="kc-menu-btn" aria-expanded="false" aria-controls="kc-nav-panel">
        <span data-i18n="menuBtn">Menu</span> ▾
      </button>
    </div>

    <nav class="kc-nav__panel" id="kc-nav-panel" aria-label="Comic Navigation" hidden>
      <button class="kc-nav__link kc-nav__link--hub" type="button" id="nav-go-hub">
        <span data-i18n="navComicHub">📖 Series Hub &amp; Episodes</span>
        <span class="kc-nav__idx">20 EP</span>
      </button>
      <button class="kc-nav__link" type="button" id="nav-open-passport">
        <span>🏅 Collectible Spell Passport</span>
        <span class="kc-nav__idx">SEALS</span>
      </button>
      <button class="kc-nav__link" type="button" id="nav-open-grimoire">
        <span data-i18n="navGrimoire">📜 11 Spells Grimoire</span>
        <span class="kc-nav__idx">BONUS</span>
      </button>
      <a class="kc-nav__link" id="nav-link-storybook" href="./index.html">
        <span data-i18n="navStorybook">✨ Interactive Storybook ↗</span>
        <span class="kc-nav__idx">SITE</span>
      </a>
      <a class="kc-nav__link" id="nav-link-hub" href="./hub.html">
        <span data-i18n="navLearningHub">🏰 Learning Hub &amp; 12 Sanctuaries ↗</span>
        <span class="kc-nav__idx">HUB</span>
      </a>
      <a class="kc-nav__link" id="nav-download-pdf" href="https://drive.google.com/file/d/1bxT5o4bu6-YPnuiRILRkUxM3-lLx1x7P/view?usp=drivesdk" target="_blank" rel="noopener noreferrer">
        <span data-i18n="navPdf">📥 Download 73-Page PDF ↗</span>
        <span class="kc-nav__idx">6.7MB</span>
      </a>
    </nav>
  </div>

  <!-- VIEW 1: WEBTOON SERIES HUB -->
  <main id="view-hub" class="comic-hub" aria-label="Hero Kai Comic Series Hub"></main>

  <!-- VIEW 2: IMMERSIVE VERTICAL WEBTOON READER -->
  <section id="view-reader" class="comic-reader" aria-label="Webtoon Episode Reader" hidden>
    <div id="reader-ep-banner" class="reader-ep-banner"></div>
    <div id="reader-resume-banner" class="resume-banner" hidden></div>
    <div id="webtoon-canvas" class="webtoon-canvas" title="Tap anywhere to toggle reading controls"></div>

    <!-- Pluggable Module Slot (Hosts v2.0 Live Spell-Portal & future modules) -->
    <div id="reader-module-slot" class="module-slot"></div>

    <div id="reader-end-card" class="reader-end-card"></div>

    <!-- Desktop Left-Flank Realm Companion Rail -->
    <aside class="hf-companion-rail" id="hf-companion-rail" aria-label="Realm reading companion"></aside>

    <!-- Floating Right Rail: Scroll %, Jump to Spell Portal, Back to Top -->
    <div class="reader-float-rail" aria-label="Quick Reader Actions">
      <button type="button" class="float-pill-btn float-pill-btn--spell" id="float-spell-btn" title="Jump to Live Python Spell Portal">✨</button>
      <button type="button" class="float-pill-btn" id="float-top-btn" title="Back to Top">↑</button>
      <div class="float-pill-btn" id="float-pct-btn" style="cursor:default;" aria-label="Scroll progress">0%</div>
    </div>

    <!-- Floating Bottom Webtoon HUD -->
    <div class="reader-hud-bottom" id="reader-hud-bottom" role="toolbar" aria-label="Webtoon Reader Controls">
      <div class="reader-hud-group">
        <button class="hud-btn" type="button" id="hud-btn-hub" title="Back to Series Hub">← <span class="hud-label-desktop" data-i18n="hubShort">Hub</span></button>
        <button class="hud-btn" type="button" id="hud-btn-prev" title="Previous Episode">‹</button>
      </div>

      <button class="hud-ep-pill" type="button" id="hud-ep-switcher" title="Open Episode List">
        <span class="hud-ep-code" id="hud-ep-code">EP 00 · 0%</span>
        <span class="hud-ep-title" id="hud-ep-title">Prologue</span>
      </button>

      <div class="reader-hud-group">
        <button class="hud-btn" type="button" id="hud-btn-autoscroll" title="Hands-Free Auto-Scroll (Key: A)">▶ <span class="hud-label-desktop" id="hud-autoscroll-label">Auto</span></button>
        <button class="hud-btn" type="button" id="hud-btn-comfort" title="Reading Comfort Settings">⚙</button>
        <button class="hud-btn hud-btn--primary" type="button" id="hud-btn-next" title="Next Episode"><span class="hud-label-desktop" data-i18n="nextShort">Next</span> ›</button>
      </div>
    </div>

    <!-- Reading Comfort Popover -->
    <div class="comfort-popover" id="comfort-popover" hidden>
      <div class="comfort-row">
        <span class="comfort-row__label" data-i18n="themeLabel">Backdrop</span>
        <div class="comfort-pills" role="group" aria-label="Reading backdrop">
          <button class="comfort-pill" type="button" data-theme-opt="forest" aria-pressed="true">Forest</button>
          <button class="comfort-pill" type="button" data-theme-opt="cinema" aria-pressed="false">Cinema</button>
          <button class="comfort-pill" type="button" data-theme-opt="parchment" aria-pressed="false">Parchment</button>
        </div>
      </div>
      <div class="comfort-row">
        <span class="comfort-row__label">Hyperframe</span>
        <div class="comfort-pills" role="group" aria-label="Background hyperframe intensity">
          <button class="comfort-pill" type="button" data-hyperframe-opt="living" aria-pressed="true">✨ Living</button>
          <button class="comfort-pill" type="button" data-hyperframe-opt="subtle" aria-pressed="false">Subtle</button>
          <button class="comfort-pill" type="button" data-hyperframe-opt="off" aria-pressed="false">Off</button>
        </div>
      </div>
      <div class="comfort-row">
        <span class="comfort-row__label" data-i18n="widthLabel">Strip Width</span>
        <div class="comfort-pills" role="group" aria-label="Comic strip width">
          <button class="comfort-pill" type="button" data-width-opt="640" aria-pressed="false">640px</button>
          <button class="comfort-pill" type="button" data-width-opt="800" aria-pressed="true">800px</button>
          <button class="comfort-pill" type="button" data-width-opt="920" aria-pressed="false">920px</button>
        </div>
      </div>
      <div class="comfort-row">
        <span class="comfort-row__label" data-i18n="brightLabel">Brightness</span>
        <input class="comfort-range" id="comfort-brightness" type="range" min="65" max="100" value="100" aria-label="Reading brightness" />
        <span class="comfort-row__label" id="comfort-bright-val">100%</span>
      </div>
      <div class="comfort-row" style="justify-content:flex-end;">
        <button class="comfort-pill" type="button" id="comfort-shortcuts-btn">⌨️ Keyboard Shortcuts (?)</button>
      </div>
    </div>
  </section>

  <!-- Slide-Over Episode Drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="episode-drawer" id="episode-drawer" aria-label="All Episodes" hidden>
    <div class="drawer-header">
      <h3 data-i18n="drawerTitle">Vol. 1 &amp; 2 · 20 Episodes</h3>
      <button class="drawer-close" type="button" id="drawer-close-btn" aria-label="Close drawer">✕</button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
  </aside>

  <!-- Universal Lightbox Modal -->
  <div class="comic-modal-backdrop" id="comic-modal-backdrop" hidden>
    <div class="comic-modal" role="dialog" aria-modal="true" aria-labelledby="comic-modal-title">
      <div class="comic-modal__head">
        <h3 id="comic-modal-title">Spell Grimoire</h3>
        <button class="drawer-close" type="button" id="comic-modal-close" aria-label="Close modal">✕</button>
      </div>
      <div id="comic-modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="comic-toast" id="comic-toast" role="status" aria-live="polite"></div>

  <!-- Core Runtime -->
  <script src="js/core/event-bus.js"></script>
  <script src="js/core/state-store.js"></script>
  <script src="js/core/module-registry.js"></script>

  <!-- Canonical Data -->
  <script src="js/data/episodes-manifest.js"></script>

  <!-- Pluggable Feature Modules (Add future modules right below!) -->
  <script src="js/modules/i18n-audio.module.js"></script>
  <script src="js/modules/hub-view.module.js"></script>
  <script src="js/modules/reader-stage.module.js"></script>
  <script src="js/modules/autoscroll-comfort.module.js"></script>
  <script src="js/modules/integration-bridge.module.js"></script>
  <script src="js/modules/spell-portal.module.js"></script>
  <script src="js/modules/hyperframe-stage.module.js"></script>

  <!-- Bootstrap -->
  <script src="js/app.js"></script>
</body>
</html>
